update.effective_chat.i# -*- coding: utf-8 -*-
import logging
import json
from typing import Tuple, Optional
from telegram import Update, Chat, ChatMember, ChatMemberUpdated
from telegram.constants import ParseMode
from telegram.ext import (
    Application,
    CommandHandler,
    MessageHandler,
    filters,
    ContextTypes,
    ChatMemberHandler,
    PollAnswerHandler,
    PollHandler,
)

# استيراد التوكن من ملف الإعدادات
from config import BOT_TOKEN

# إعداد تسجيل الدخول (Logging)
logging.basicConfig(
    format="%(asctime)s - %(name)s - %(levelname)s - %(message)s", level=logging.INFO
)
logging.getLogger("httpx").setLevel(logging.WARNING)
logger = logging.getLogger(__name__)

# --- قائمة الكلمات الممنوعة لإدارة التعليقات (يمكن تعديلها في ملف منفصل لاحقًا) ---
# مبدئيًا فارغة، يمكن للمستخدم إضافتها لاحقًا
FORBIDDEN_WORDS = [] 

# --- ملف الأسئلة والأجوبة (سيتم إنشاؤه لاحقًا) ---
QA_FILE = "qa_list.json"
QA_DATA = {}

def load_qa_data():
    """تحميل بيانات الأسئلة والأجوبة من ملف JSON."""
    global QA_DATA
    try:
        with open(QA_FILE, 'r', encoding='utf-8') as f:
            QA_DATA = json.load(f)
        logger.info(f"تم تحميل بيانات الأسئلة والأجوبة من {QA_FILE}")
    except FileNotFoundError:
        logger.warning(f"ملف الأسئلة والأجوبة {QA_FILE} غير موجود. سيتم استخدام قائمة فارغة.")
        QA_DATA = {}
    except json.JSONDecodeError:
        logger.error(f"خطأ في قراءة ملف الأسئلة والأجوبة {QA_FILE}. تأكد من أنه بصيغة JSON صحيحة.")
        QA_DATA = {}

# --- وظائف المساعدة لاستخراج التغييرات في حالة العضو ---
def extract_status_change(
    chat_member_update: ChatMemberUpdated,
) -> Optional[Tuple[bool, bool]]:
    """Takes a ChatMemberUpdated instance and extracts whether the 'old_chat_member' was a member
    of the chat and whether the 'new_chat_member' is a member of the chat. Returns None, if
    the status didn't change.
    """
    status_change = chat_member_update.difference().get("status")
    old_is_member, new_is_member = chat_member_update.difference().get("is_member", (None, None))

    if status_change is None and old_is_member is None:
        return None

    old_status, new_status = status_change or (None, None)

    was_member = old_status in [
        ChatMember.MEMBER,
        ChatMember.OWNER,
        ChatMember.ADMINISTRATOR,
    ] or (old_status == ChatMember.RESTRICTED and old_is_member is True)
    is_member = new_status in [
        ChatMember.MEMBER,
        ChatMember.OWNER,
        ChatMember.ADMINISTRATOR,
    ] or (new_status == ChatMember.RESTRICTED and new_is_member is True)

    return was_member, is_member

# --- معالج رسائل الترحيب --- 
async def greet_chat_members(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
    """ترحب بالمستخدمين الذين ينضمون إلى الدردشة.
    """
    result = extract_status_change(update.chat_member)
    if result is None:
        return

    was_member, is_member = result
    member_name = update.chat_member.new_chat_member.user.mention_html()

    if not was_member and is_member:
        logger.info(f"{member_name} انضم إلى الدردشة {update.effective_chat.title}")
        welcome_message = (
            f"أهلاً وسهلاً بك {member_name} في قناتنا! نورتنا ✨\n"
            f"نتمنى لك وقتاً ممتعاً ومفيداً."
        )
        # التأكد من أن البوت لديه صلاحية إرسال الرسائل في القناة/المجموعة
        try:
            await update.effective_chat.send_message(
                welcome_message,
                parse_mode=ParseMode.HTML,
            )
        except Exception as e:
             logger.error(f"خطأ في إرسال رسالة الترحيب: {e}")

# --- معالج إدارة التعليقات (فلترة أساسية) ---
async def manage_comments(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
    """حذف الرسائل التي تحتوي على كلمات ممنوعة.
    هذه وظيفة أساسية، يمكن تطويرها لإضافة ميزات أكثر تقدمًا.
    """
    if not update.message or not update.message.text:
        return

    message_text = update.message.text.lower()
    user = update.effective_user
    chat = update.effective_chat

    # التحقق من وجود كلمات ممنوعة
    if any(word in message_text for word in FORBIDDEN_WORDS):
        try:
            await update.message.delete()
            logger.info(f"تم حذف رسالة من {user.mention_html()} في {chat.title} لاحتوائها على كلمة ممنوعة.")
            # يمكن إرسال رسالة تحذير للمستخدم إذا أردت
            # await context.bot.send_message(chat_id=user.id, text="رسالتك في المجموعة [...] تم حذفها لمخالفتها القواعد.")
        except Exception as e:
            logger.error(f"خطأ في حذف الرسالة: {e}. قد لا يمتلك البوت صلاحية الحذف.")

# --- معالج الإجابة على الاستفسارات --- 
async def answer_question(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
    """الرد على رسائل المستخدمين إذا كانت تطابق سؤالاً في القائمة.
    """
    if not update.message or not update.message.text:
        return

    question = update.message.text.strip()
    user = update.effective_user

    # البحث عن السؤال في البيانات المحملة
    answer = QA_DATA.get(question)

    if answer:
        logger.info(f"تم العثور على إجابة لسؤال المستخدم {user.mention_html()}: {question}")
        await update.message.reply_text(answer)
    # else: # يمكن إضافة رد افتراضي إذا لم يتم العثور على إجابة
    #     await update.message.reply_text("عذرًا، لم أجد إجابة لسؤالك في قائمتي.")

# --- معالج أمر إنشاء استطلاع رأي --- 
async def poll_command(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
    """إنشاء استطلاع رأي جديد بناءً على أمر المستخدم.
    الصيغة: /poll السؤال; الخيار1; الخيار2; ...
    """
    if not context.args:
        await update.message.reply_text("الرجاء تحديد السؤال والخيارات. الصيغة: /poll السؤال; الخيار1; الخيار2; ...")
        return

    try:
        # فصل النص باستخدام الفاصلة المنقوطة
        parts = " ".join(context.args).split(';')
        question = parts[0].strip()
        # إزالة المسافات الزائدة من الخيارات والتأكد من وجود خيارين على الأقل
        options = [opt.strip() for opt in parts[1:] if opt.strip()]

        if len(options) < 2:
            await update.message.reply_text("يجب توفير خيارين على الأقل للاستطلاع.")
            return
        if len(options) > 10:
             await update.message.reply_text("لا يمكن إنشاء استطلاع بأكثر من 10 خيارات.")
             return
        if not question:
            await update.message.reply_text("الرجاء تحديد سؤال للاستطلاع.")
            return

        # إرسال الاستطلاع إلى الدردشة
        await context.bot.send_poll(
            chat_id=update.effective_chat.id,
            question=question,
            options=options,
            is_anonymous=False,  # يمكن جعله مجهولاً بتغيير القيمة إلى True
            allows_multiple_answers=False, # يمكن السماح بإجابات متعددة بتغيير القيمة إلى True
        )
        logger.info(f"تم إنشاء استطلاع بواسطة {update.effective_user.mention_html()} في {update.effective_chat.title}")

    except Exception as e:
        logger.error(f"خطأ في إنشاء الاستطلاع: {e}")
        await update.message.reply_text("حدث خطأ أثناء محاولة إنشاء الاستطلاع. تأكد من صحة الصيغة.")

# --- دالة الأمر /start --- 
async def start(update: Update, context: ContextTypes.DEFAULT_TYPE) -> None:
    """إرسال رسالة عند إرسال الأمر /start.
    """
    user = update.effective_user
    await update.message.reply_html(
        rf"أهلاً {user.mention_html()}! أنا البوت الخاص بك، جاهز للمساعدة في إدارة القناة.",
    )

# --- (وظيفة نشر التحديثات التلقائية - سيتم إضافتها لاحقًا إذا لزم الأمر) ---

def main() -> None:
    """بدء تشغيل البوت."""
    # تحميل بيانات الأسئلة والأجوبة عند البدء
    load_qa_data()

    # إنشاء كائن التطبيق وتمرير توكن البوت إليه.
    application = Application.builder().token(BOT_TOKEN).build()

    # --- إضافة المعالجات --- 
    # 1. الأمر /start
    application.add_handler(CommandHandler("start", start))

    # 2. رسائل الترحيب/الوداع للأعضاء
    application.add_handler(ChatMemberHandler(greet_chat_members, ChatMemberHandler.CHAT_MEMBER))

    # 3. أمر إنشاء استطلاع /poll
    application.add_handler(CommandHandler("poll", poll_command))

    # 4. إدارة التعليقات (التحقق من الكلمات الممنوعة)
    # يجب أن يكون هذا المعالج بعد معالجات الأوامر الأخرى لتجنب التدخل
    # يعمل فقط على الرسائل النصية في المجموعات والقنوات الفائقة، وليس الأوامر
    application.add_handler(MessageHandler(
        filters.TEXT & ~filters.COMMAND & (filters.ChatType.GROUPS | filters.ChatType.SUPERGROUP),
        manage_comments
    ))

    # 5. الإجابة على الاستفسارات (التحقق من تطابق الرسالة مع سؤال)
    # يعمل فقط على الرسائل النصية في المجموعات والقنوات الفائقة، وليس الأوامر
    application.add_handler(MessageHandler(
        filters.TEXT & ~filters.COMMAND & (filters.ChatType.GROUPS | filters.ChatType.SUPERGROUP),
        answer_question
    ))

    # (يمكن إضافة معالجات أخرى هنا لوظائف إضافية مثل التحديثات التلقائية)

    # تشغيل البوت حتى يتم إيقافه يدويًا (مثل الضغط على CTRL+C)
    logger.info("بدء تشغيل البوت...")
    application.run_polling(allowed_updates=Update.ALL_TYPES)

if __name__ == "__main__":
    main()

